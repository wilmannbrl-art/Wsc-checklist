<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --surface2: #181818;
    --border: #2a2a2a;
    --accent: #e8ff47;
    --accent2: #ff4d1c;
    --text: #f0f0f0;
    --muted: #666;
    --done: #2ecc71;
    --warn: #f39c12;
    --critical: #e74c3c;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    letter-spacing: 0.1em;
    color: var(--accent);
  }

  .logo span { color: var(--text); }

  .progress-header {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .progress-bar {
    width: 200px;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--done));
    border-radius: 3px;
    transition: width 0.4s ease;
  }

  .progress-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    color: var(--accent);
    min-width: 60px;
  }

  .btn-reset {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 0.4rem 1rem;
    border-radius: 4px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem;
    transition: all 0.2s;
  }
  .btn-reset:hover { border-color: var(--accent2); color: var(--accent2); }

  /* HERO */
  .hero {
    padding: 3rem 2rem 2rem;
    max-width: 1100px;
    margin: 0 auto;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.5rem, 6vw, 5rem);
    line-height: 0.9;
    letter-spacing: 0.05em;
    margin-bottom: 0.5rem;
  }

  h1 .line2 { color: var(--accent); }

  .hero-meta {
    display: flex;
    gap: 1rem;
    margin-top: 1.5rem;
    flex-wrap: wrap;
  }

  .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    padding: 0.3rem 0.8rem;
    border-radius: 3px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .tag.hot { border-color: var(--accent2); color: var(--accent2); }
  .tag.sport { border-color: var(--accent); color: var(--accent); }

  /* LAYOUT */
  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 2rem;
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 2rem;
    align-items: start;
  }

  /* SIDEBAR NAV */
  .sidebar {
    position: sticky;
    top: 80px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .sidebar-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 1rem 1.2rem 0.5rem;
  }

  .nav-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.65rem 1.2rem;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: all 0.2s;
    font-size: 0.88rem;
  }
  .nav-item:hover { background: var(--surface2); }
  .nav-item.active { border-left-color: var(--accent); background: var(--surface2); color: var(--accent); }

  .nav-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
  }
  .nav-item.active .nav-count { color: var(--accent); }

  /* MAIN CONTENT */
  .main-content { display: flex; flex-direction: column; gap: 2rem; }

  /* SECTION */
  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .section-header {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1.2rem 1.5rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }

  .section-icon {
    font-size: 1.4rem;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    border-radius: 6px;
    border: 1px solid var(--border);
  }

  .section-info { flex: 1; }

  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 0.06em;
  }

  .section-desc {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 0.1rem;
  }

  .section-progress {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    color: var(--accent);
    white-space: nowrap;
  }

  /* SUBSECTION */
  .subsection {
    border-bottom: 1px solid var(--border);
  }
  .subsection:last-child { border-bottom: none; }

  .subsection-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0.8rem 1.5rem 0.3rem;
  }

  /* ITEM */
  .item {
    display: flex;
    align-items: flex-start;
    gap: 1rem;
    padding: 0.8rem 1.5rem;
    cursor: pointer;
    transition: background 0.15s;
    border-left: 3px solid transparent;
  }
  .item:hover { background: var(--surface2); }
  .item.checked { border-left-color: var(--done); }
  .item.checked .item-name { color: var(--muted); text-decoration: line-through; }

  .checkbox {
    width: 20px;
    height: 20px;
    border: 2px solid var(--border);
    border-radius: 4px;
    flex-shrink: 0;
    margin-top: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .item.checked .checkbox {
    background: var(--done);
    border-color: var(--done);
  }
  .item.checked .checkbox::after {
    content: '✓';
    color: #fff;
    font-size: 0.75rem;
    font-weight: 700;
  }

  .item-body { flex: 1; }

  .item-name {
    font-size: 0.92rem;
    font-weight: 500;
    transition: color 0.2s;
  }

  .item-detail {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 0.2rem;
    line-height: 1.5;
  }

  .badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    padding: 0.15rem 0.5rem;
    border-radius: 3px;
    margin-left: 0.5rem;
    vertical-align: middle;
  }
  .badge.critical { background: #3d0f0f; color: var(--critical); border: 1px solid #5a1a1a; }
  .badge.warn { background: #3d2a00; color: var(--warn); border: 1px solid #5a3d00; }
  .badge.hot { background: #3d1500; color: #ff7043; border: 1px solid #5a2200; }
  .badge.regl { background: #0d2a3d; color: #4fc3f7; border: 1px solid #1a4560; }

  /* FOOTER */
  footer {
    text-align: center;
    padding: 2rem;
    color: var(--muted);
    font-size: 0.75rem;
    font-family: 'JetBrains Mono', monospace;
    border-top: 1px solid var(--border);
    margin-top: 2rem;
  }

  @media (max-width: 768px) {
    .container { grid-template-columns: 1fr; }
    .sidebar { position: static; }
    .progress-bar { width: 120px; }
  }
</style>
</head>

          { name: "Rituel de pre-lift (défini avant la compét)", detail: "Même routine d'entrée barre à l'entraînement et en compétition. Ancrage conditionné." },
          { name: "Contact coach / handler identifié", detail: "Qui te donne les tentatives ? Qui gère le passage en tableau ? Ne pas improviser ça le jour J.", badge: "critical" },
        ]
      },
      {
        sub: "Gestion émotionnelle",
        list: [
          { name: "Technique de cohérence cardiaque (app Respirelax)", detail: "5 min avant chaque plateau : 5s inspir / 5s expir. Redescente du cortisol, focus." },
          { name: "Visualisation mentale des 3 lifts (pratiquée avant)", detail: "20 min de visualisation la veille. Chaque lift en entier, réussi." },
          { name: "Stratégie de reset après raté", detail: "Protocole de récupération mentale si la 1ère tentative est rouge. Avoir la procédure en tête.", badge: "warn" },
        ]
      }
    ]
  },
  {
    id: "veille",
    icon: "🌙",
    title: "Protocole la Veille",
    desc: "La compétition se gagne la veille",
    items: [
      {
        sub: "La veille au soir",
        list: [
          { name: "Préparer et tester tout l'équipement", detail: "Enfiler le singlet, la ceinture, tester les lacets des chaussures. Zéro surprise le matin." },
          { name: "Sac entièrement préparé et posé à la porte", detail: "Checklist faite, sac fermé, prêt à partir." },
          { name: "Repas high carb, low fibre la veille", detail: "Riz blanc, pâtes blanches, poulet, jambon. Éviter les légumes crus, les légumineuses, les épices." },
          { name: "Hydratation anticipée (2–3L dans la journée)", detail: "Ne pas tenter de s'hydrater massivement le matin. La cellule s'hydrate en 24–48h.", badge: "hot" },
          { name: "Sommeil cible : 8h minimum", detail: "Se coucher tôt même si difficile. Pas de sport la veille. Magnésium + obscurité totale." },
          { name: "Réveil défini avec deux alarmes", detail: "Calculer : départ → route → arrivée → pesée → warm-up → premier plateau." },
        ]
      },
      {

        list: [
          { name: "Repas 2–3h avant le premier plateau (high carb)", detail: "Flocons d'avoine, banane, pain blanc, beurre de cacahuètes, café si habitué." },
          { name: "500ml d'eau + électrolytes au réveil", detail: "Réhydratation après la nuit. Surtout critique en été.", badge: "hot" },
          { name: "Aller aux toilettes avant de partir", detail: "Éviter le stress logistique à l'arrivée." },
          { name: "Vérifier la météo / trajet", detail: "Conditions de route, parking, horaires de transport si pas en voiture." },

let checked = {};

function save() {
  localStorage.setItem('wsc_checklist', JSON.stringify(checked));
}

function load() {
  const d = localStorage.getItem('wsc_checklist');
  if (d) checked = JSON.parse(d);
}

function resetAll() {
  if (confirm('Remettre toute la checklist à zéro ?')) {
    checked = {};
    save();
    renderAll();
  }
}

function toggleItem(id) {
  checked[id] = !checked[id];
  save();
  updateItem(id);
  updateProgress();
  updateSectionProgress();
}

function updateItem(id) {
  const el = document.querySelector(`[data-id="${id}"]`);
  if (!el) return;
  el.classList.toggle('checked', !!checked[id]);
}

function allItemIds() {
  const ids = [];
  DATA.forEach(sec => sec.items.forEach(sub => sub.list.forEach((_, i) => ids.push(`${sec.id}_${sub.sub}_${i}`))));
  return ids;
}

function updateProgress() {
  const all = allItemIds();
  const done = all.filter(id => checked[id]).length;
  const pct = all.length ? (done / all.length * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${done} / ${all.length}`;
}

function updateSectionProgress() {
  DATA.forEach(sec => {
    const ids = [];
    sec.items.forEach(sub => sub.list.forEach((_, i) => ids.push(`${sec.id}_${sub.sub}_${i}`)));
    const done = ids.filter(id => checked[id]).length;
    const el = document.getElementById(`sp_${sec.id}`);
    if (el) el.textContent = `${done}/${ids.length}`;
    const navEl = document.getElementById(`nav_${sec.id}`);
    if (navEl) navEl.textContent = `${done}/${ids.length}`;
  });
}

function renderAll() {
  const nav = document.getElementById('sidebar');
  const main = document.getElementById('mainContent');

  // Nav
  nav.innerHTML = '<div class="sidebar-title">Navigation</div>';
  DATA.forEach(sec => {
    const div = document.createElement('div');
    div.className = 'nav-item';
    div.innerHTML = `<span>${sec.icon} ${sec.title}</span><span class="nav-count" id="nav_${sec.id}">0/0</span>`;
    div.onclick = () => document.getElementById(`sec_${sec.id}`).scrollIntoView({ behavior: 'smooth', block: 'start' });
    nav.appendChild(div);
  });

  // Main
  main.innerHTML = '';
  DATA.forEach(sec => {
    const section = document.createElement('div');
    section.className = 'section';
    section.id = `sec_${sec.id}`;

    let html = `
      <div class="section-header">
        <div class="section-icon">${sec.icon}</div>
        <div class="section-info">
          <div class="section-title">${sec.title}</div>
          <div class="section-desc">${sec.desc}</div>
        </div>
        <div class="section-progress" id="sp_${sec.id}">0/0</div>
      </div>
    `;

    sec.items.forEach(sub => {
      html += `<div class="subsection"><div class="subsection-title">${sub.sub}</div>`;
      sub.list.forEach((item, i) => {
        const id = `${sec.id}_${sub.sub}_${i}`;
        const isChecked = !!checked[id];
        const badgeHtml = item.badge ? `<span class="badge ${item.badge}">${{critical:'CRITIQUE',warn:'ATTENTION',hot:'CHALEUR',regl:'RÉGLEMENTAIRE'}[item.badge]}</span>` : '';
        html += `
          <div class="item ${isChecked ? 'checked' : ''}" data-id="${id}" onclick="toggleItem('${id}')">
            <div class="checkbox"></div>
            <div class="item-body">
              <div class="item-name">${item.name}${badgeHtml}</div>
              ${item.detail ? `<div class="item-detail">${item.detail}</div>` : ''}
            </div>
          </div>
        `;
      });
      html += '</div>';
    });

    section.innerHTML = html;
    main.appendChild(section);
  });

  updateProgress();
  updateSectionProgress();
}

load();
renderAll();
</script>
</body>
</html>
