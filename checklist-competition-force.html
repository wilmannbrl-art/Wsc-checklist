<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WSC Compet">
<title>WSC — Checklist Competition</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#080808;--s1:#101010;--s2:#161616;--s3:#1e1e1e;
  --border:#252525;--accent:#e8ff47;--accent-dim:#b8cc30;
  --red:#ff3d3d;--orange:#ff6b2b;--blue:#4fc3f7;--green:#39d98a;
  --purple:#c084fc;--yellow:#fbbf24;--cold:#60a5fa;
  --text:#f0f0f0;--muted:#555;--muted2:#888;--radius:10px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden}
#onboarding{min-height:100vh;display:flex;flex-direction:column;padding:0 0 2rem}
.ob-hero{display:flex;flex-direction:column;align-items:center;padding:3rem 1.5rem 2rem;background:linear-gradient(180deg,#0f0f0f 0%,var(--bg) 100%);border-bottom:1px solid var(--border);margin-bottom:2rem}
.ob-logo{width:100px;height:100px;object-fit:contain;margin-bottom:1rem;filter:drop-shadow(0 0 20px rgba(232,255,71,0.3))}
.ob-title{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;letter-spacing:0.12em;color:var(--accent);text-align:center;line-height:1}
.ob-sub{font-size:0.78rem;color:var(--muted2);margin-top:0.4rem;letter-spacing:0.08em;text-transform:uppercase;font-family:'JetBrains Mono',monospace}
.ob-steps{padding:0 1.2rem;display:flex;flex-direction:column;gap:1.8rem}
.ob-step-label{font-family:'JetBrains Mono',monospace;font-size:0.68rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted2);margin-bottom:0.7rem;display:flex;align-items:center;gap:0.5rem}
.ob-step-label::after{content:'';flex:1;height:1px;background:var(--border)}
.ob-grid{display:grid;gap:0.6rem}
.ob-grid.cols-2{grid-template-columns:1fr 1fr}
.ob-grid.cols-3{grid-template-columns:1fr 1fr 1fr}
.ob-btn{background:var(--s2);border:1.5px solid var(--border);border-radius:var(--radius);padding:0.9rem 0.6rem;display:flex;flex-direction:column;align-items:center;gap:0.4rem;cursor:pointer;transition:all 0.18s;position:relative;overflow:hidden}
.ob-btn:active{transform:scale(0.97)}
.ob-btn.selected{border-color:var(--accent);background:rgba(232,255,71,0.07)}
.ob-btn.selected::after{content:'✓';position:absolute;top:6px;right:8px;font-size:0.65rem;color:var(--accent);font-weight:700}
.ob-btn-icon{font-size:1.6rem;line-height:1}
.ob-btn-label{font-size:0.78rem;font-weight:600;text-align:center;color:var(--text);line-height:1.2}
.ob-btn-sub{font-size:0.65rem;color:var(--muted2);text-align:center;line-height:1.2}
.ob-launch{margin:2rem 1.2rem 0;background:var(--accent);color:#000;border:none;border-radius:var(--radius);padding:1.1rem;font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:0.1em;cursor:pointer;width:calc(100% - 2.4rem);transition:all 0.18s;opacity:0.3;pointer-events:none}
.ob-launch.ready{opacity:1;pointer-events:all}
.ob-launch.ready:active{transform:scale(0.98);background:var(--accent-dim)}
#app{display:none;flex-direction:column;min-height:100vh}
.app-header{position:sticky;top:0;z-index:100;background:rgba(8,8,8,0.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0.8rem 1.2rem}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.7rem;gap:0.5rem}
.header-logo{width:36px;height:36px;object-fit:contain;flex-shrink:0}
.header-tags{display:flex;gap:0.3rem;flex-wrap:wrap;flex:1;justify-content:center}
.htag{font-family:'JetBrains Mono',monospace;font-size:0.58rem;padding:0.2rem 0.5rem;border-radius:4px;font-weight:600;letter-spacing:0.06em}
.progress-row{display:flex;align-items:center;gap:0.8rem}
.prog-bar{flex:1;height:5px;background:var(--s3);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:3px;transition:width 0.4s cubic-bezier(0.4,0,0.2,1)}
.prog-text{font-family:'JetBrains Mono',monospace;font-size:0.75rem;color:var(--accent);min-width:52px;text-align:right}
.btn-reset{background:none;border:1px solid var(--border);color:var(--muted2);padding:0.3rem 0.7rem;border-radius:5px;font-size:0.7rem;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s;white-space:nowrap;flex-shrink:0}
.btn-reset:active{color:var(--red);border-color:var(--red)}
.alert-missing{display:none;margin:0.8rem 1.2rem 0;background:rgba(255,61,61,0.1);border:1px solid rgba(255,61,61,0.3);border-radius:8px;padding:0.7rem 1rem;font-size:0.78rem;color:var(--red);font-weight:500}
.app-content{padding:1rem 1.2rem 6rem;display:flex;flex-direction:column;gap:1rem}
.section{background:var(--s1);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;animation:fadeIn 0.3s ease both}
.sec-header{display:flex;align-items:center;gap:0.8rem;padding:1rem 1rem 0.8rem;background:var(--s2);border-bottom:1px solid var(--border);cursor:pointer;user-select:none}
.sec-icon{font-size:1.3rem;width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:7px;border:1px solid var(--border);flex-shrink:0}
.sec-info{flex:1;min-width:0}
.sec-title{font-family:'Bebas Neue',sans-serif;font-size:1.15rem;letter-spacing:0.06em;line-height:1.1}
.sec-desc{font-size:0.7rem;color:var(--muted2);margin-top:0.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-meta{display:flex;flex-direction:column;align-items:flex-end;gap:0.2rem;flex-shrink:0}
.sec-prog{font-family:'JetBrains Mono',monospace;font-size:0.72rem;color:var(--muted2)}
.sec-prog.done{color:var(--green)}
.sec-chevron{font-size:0.6rem;color:var(--muted);transition:transform 0.2s}
.sec-chevron.open{transform:rotate(180deg)}
.sec-body{display:none}
.sec-body.open{display:block}
.subsec-title{font-family:'JetBrains Mono',monospace;font-size:0.62rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);padding:0.7rem 1rem 0.25rem;border-top:1px solid var(--border)}
.item{display:flex;align-items:flex-start;gap:0.8rem;padding:0.75rem 1rem;cursor:pointer;border-left:3px solid transparent;transition:background 0.12s}
.item:active{background:var(--s3)}
.item.checked{border-left-color:var(--green);opacity:0.6}
.item.critical{border-left-color:rgba(255,61,61,0.3)}
.item.critical.checked{border-left-color:var(--green);opacity:0.6}
.chk{width:22px;height:22px;border:2px solid var(--border);border-radius:5px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all 0.15s;background:var(--s2)}
.item.checked .chk{background:var(--green);border-color:var(--green)}
.item.checked .chk::after{content:'✓';color:#000;font-size:0.8rem;font-weight:700}
.item-body{flex:1;min-width:0}
.item-name{font-size:0.88rem;font-weight:600;line-height:1.3;transition:color 0.15s}
.item.checked .item-name{text-decoration:line-through;color:var(--muted2)}
.item-detail{font-size:0.73rem;color:var(--muted2);margin-top:0.2rem;line-height:1.45}
.item-badges{display:flex;flex-wrap:wrap;gap:0.3rem;margin-top:0.35rem}
.badge{font-family:'JetBrains Mono',monospace;font-size:0.58rem;padding:0.12rem 0.45rem;border-radius:3px;font-weight:700;letter-spacing:0.05em}
.b-crit{background:rgba(255,61,61,0.15);color:var(--red);border:1px solid rgba(255,61,61,0.3)}
.b-warn{background:rgba(251,191,36,0.12);color:var(--yellow);border:1px solid rgba(251,191,36,0.25)}
.b-hot{background:rgba(255,107,43,0.12);color:var(--orange);border:1px solid rgba(255,107,43,0.25)}
.b-cold{background:rgba(96,165,250,0.12);color:var(--cold);border:1px solid rgba(96,165,250,0.25)}
.b-regl{background:rgba(79,195,247,0.1);color:var(--blue);border:1px solid rgba(79,195,247,0.2)}
.b-intl{background:rgba(255,61,61,0.1);color:var(--red);border:1px solid rgba(255,61,61,0.2)}
#summary{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:200;overflow-y:auto;padding:2rem 1.2rem}
.sum-header{text-align:center;margin-bottom:2rem}
.sum-logo{width:60px;height:60px;object-fit:contain;margin-bottom:0.8rem}
.sum-title{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:0.1em;color:var(--accent)}
.sum-score{font-family:'JetBrains Mono',monospace;font-size:3rem;font-weight:700;color:var(--green);margin:0.5rem 0}
.sum-score.warn{color:var(--yellow)}
.sum-score.danger{color:var(--red)}
.sum-label{font-size:0.8rem;color:var(--muted2)}
.missing-list{background:var(--s1);border:1px solid rgba(255,61,61,0.3);border-radius:var(--radius);overflow:hidden;margin-bottom:1.5rem}
.missing-title{padding:0.8rem 1rem;background:rgba(255,61,61,0.1);font-family:'JetBrains Mono',monospace;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--red);border-bottom:1px solid rgba(255,61,61,0.2)}
.missing-item{padding:0.65rem 1rem;font-size:0.82rem;border-bottom:1px solid var(--border)}
.missing-item:last-child{border-bottom:none}
.sum-btns{display:flex;flex-direction:column;gap:0.7rem}
.sum-btn{padding:1rem;border-radius:var(--radius);border:none;font-family:'Bebas Neue',sans-serif;font-size:1.15rem;letter-spacing:0.1em;cursor:pointer;transition:all 0.15s}
.sum-btn.primary{background:var(--accent);color:#000}
.sum-btn.secondary{background:var(--s2);color:var(--text);border:1px solid var(--border)}
.sum-btn:active{transform:scale(0.98)}
.fab{position:fixed;bottom:1.5rem;right:1.2rem;background:var(--accent);color:#000;border:none;border-radius:50px;padding:0.8rem 1.4rem;font-family:'Bebas Neue',sans-serif;font-size:0.95rem;letter-spacing:0.1em;cursor:pointer;box-shadow:0 4px 20px rgba(232,255,71,0.3);z-index:50;transition:all 0.18s}
.fab:active{transform:scale(0.96)}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>

let allItems = [];

function saveState() {
  try {
    localStorage.setItem('wsc_checked', JSON.stringify(checked));
    localStorage.setItem('wsc_picks', JSON.stringify(picks));
  } catch(e) {}
}

function loadState() {
  try {
    var c = localStorage.getItem('wsc_checked');
    var p = localStorage.getItem('wsc_picks');
    if (c) { var obj = JSON.parse(c); Object.keys(obj).forEach(function(k){ checked[k] = obj[k]; }); }
    if (p) { var obj2 = JSON.parse(p); Object.keys(obj2).forEach(function(k){ picks[k] = obj2[k]; }); }
  } catch(e) {}
}
const GROUPS = ['sport','equip','meteo','role','level','weight'];

function pick(btn) {
  const group = btn.dataset.group;
  document.querySelectorAll('[data-group="' + group + '"]').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  picks[group] = btn.dataset.val;
  checkReady();
  saveState();
}

function checkReady() {
  const ready = GROUPS.every(g => picks[g]);
  document.getElementById('launchBtn').classList.toggle('ready', ready);
}

function show(item) {
  if (item.sport  && !item.sport.includes(picks.sport))   return false;
  if (item.equip  && !item.equip.includes(picks.equip))   return false;
  if (item.meteo  && !item.meteo.includes(picks.meteo))   return false;
  if (item.role   && !item.role.includes(picks.role))     return false;
  if (item.level  && !item.level.includes(picks.level))   return false;
  if (item.weight && !item.weight.includes(picks.weight)) return false;
  return true;
}

function launch() {
  document.getElementById('onboarding').style.display = 'none';
  var app = document.getElementById('app');
  app.style.display = 'flex';
  app.style.flexDirection = 'column';
  buildApp();
  saveState();
}

function buildApp() {
  var p = picks;

  // Header tags
  var tagDefs = {
    sport:  { pl: ['PL','#4fc3f7','rgba(79,195,247,0.12)'],    sm: ['SM','#ff6b2b','rgba(255,107,43,0.12)'] },
    meteo:  { cold: ['FROID','#60a5fa','rgba(96,165,250,0.12)'], neu: ['NEUTRE','#888','rgba(136,136,136,0.1)'], hot: ['CHAUD','#ff6b2b','rgba(255,107,43,0.12)'] },
    role:   { ath: ['ATHLETE','#e8ff47','rgba(232,255,71,0.1)'], coach: ['COACH','#ff3d3d','rgba(255,61,61,0.1)'] },
    level:  { loc: ['LOCAL','#39d98a','rgba(57,217,138,0.1)'],  nat: ['NATIONAL','#fbbf24','rgba(251,191,36,0.1)'], intl: ['INTL','#ff3d3d','rgba(255,61,61,0.1)'] },
  };
  var tags = document.getElementById('headerTags');
  tags.innerHTML = '';
  ['sport','meteo','role','level'].forEach(function(g) {
    if (tagDefs[g] && tagDefs[g][p[g]]) {
      var t = tagDefs[g][p[g]];
      var span = document.createElement('span');
      span.className = 'htag';
      span.style.color = t[1];
      span.style.background = t[2];
      span.style.border = '1px solid ' + t[1] + '40';
      span.textContent = t[0];
      tags.appendChild(span);
    }
  });

  // Weather banner
  var wb = document.getElementById('weatherBanner');
  if (p.meteo === 'hot') {
    wb.innerHTML = '<div style="padding:0.5rem 1.2rem;font-family:JetBrains Mono,monospace;font-size:0.72rem;color:#ff6b2b">🌡️ Mode CHALEUR actif — items thermiques mis en avant</div>';
  } else if (p.meteo === 'cold') {
    wb.innerHTML = '<div style="padding:0.5rem 1.2rem;font-family:JetBrains Mono,monospace;font-size:0.72rem;color:#60a5fa">🥶 Mode FROID actif — protocole de maintien thermique active</div>';
  } else {
    wb.innerHTML = '';
  }

  var data = getData();
  var content = document.getElementById('appContent');
  content.innerHTML = '';
  allItems = [];

  data.forEach(function(sec, si) {
    // Filter
    if (sec.id === 'strongman' && p.sport !== 'sm') return;
    if (sec.id === 'antidopage' && p.level === 'loc') return;

    var visibleSubs = sec.subs.map(function(sub) {
      return { title: sub.title, items: sub.items.filter(function(item) { return show(item); }) };
    }).filter(function(sub) { return sub.items.length > 0; });

    if (visibleSubs.length === 0) return;

    var secItemIds = [];
    visibleSubs.forEach(function(sub) {
      sub.items.forEach(function(item, ii) {
        var id = sec.id + '__' + sub.title.replace(/\s+/g,'_') + '__' + ii;
        secItemIds.push(id);
        allItems.push({ id: id, name: item.name, critical: item.badges && item.badges.indexOf('CRIT') >= 0 });
      });
    });

    var secEl = document.createElement('div');
    secEl.className = 'section';
    secEl.id = 'sec_' + sec.id;
    secEl.style.animationDelay = (si * 0.05) + 's';

    var secHtml = '<div class="sec-header" onclick="toggleSec(\'' + sec.id + '\')">'
      + '<div class="sec-icon">' + sec.icon + '</div>'
      + '<div class="sec-info"><div class="sec-title">' + sec.title + '</div>'
      + '<div class="sec-desc">' + sec.desc + '</div></div>'
      + '<div class="sec-meta"><div class="sec-prog" id="sp_' + sec.id + '">0/' + secItemIds.length + '</div>'
      + '<div class="sec-chevron open" id="chev_' + sec.id + '">▼</div></div>'
      + '</div><div class="sec-body open" id="body_' + sec.id + '"></div>';
    secEl.innerHTML = secHtml;
    content.appendChild(secEl);

    var body = document.getElementById('body_' + sec.id);

    visibleSubs.forEach(function(sub) {
      var stEl = document.createElement('div');
      stEl.className = 'subsec-title';
      stEl.textContent = sub.title;
      body.appendChild(stEl);

      sub.items.forEach(function(item, ii) {
        var id = sec.id + '__' + sub.title.replace(/\s+/g,'_') + '__' + ii;
        var isCrit = item.badges && item.badges.indexOf('CRIT') >= 0;
        var isChecked = !!checked[id];

        var badgeMap = {
          'CRIT':  ['b-crit','CRITIQUE'],
          'ATT':   ['b-warn','ATTENTION'],
          'CHAUD': ['b-hot','CHALEUR'],
          'FROID': ['b-cold','FROID'],
          'REGL':  ['b-regl','REGL'],
          'INTL':  ['b-intl','INTL']
        };
        var badgesHtml = '';
        if (item.badges) {
          item.badges.forEach(function(b) {
            if (badgeMap[b]) {
              badgesHtml += '<span class="badge ' + badgeMap[b][0] + '">' + badgeMap[b][1] + '</span>';
            }
          });
        }

        var itemEl = document.createElement('div');
        itemEl.className = 'item' + (isCrit ? ' critical' : '') + (isChecked ? ' checked' : '');
        itemEl.dataset.id = id;
        itemEl.innerHTML = '<div class="chk"></div><div class="item-body">'
          + '<div class="item-name">' + item.name + '</div>'
          + (item.detail ? '<div class="item-detail">' + item.detail + '</div>' : '')
          + (badgesHtml ? '<div class="item-badges">' + badgesHtml + '</div>' : '')
          + '</div>';

        itemEl.addEventListener('click', (function(itemId) {
          return function() { toggleItem(itemId); };
        })(id));

        body.appendChild(itemEl);
      });
    });
  });

  updateProgress();
}

function toggleSec(id) {
  var body = document.getElementById('body_' + id);
  var chev = document.getElementById('chev_' + id);
  if (body) body.classList.toggle('open');
  if (chev) chev.classList.toggle('open');
}

function toggleItem(id) {
  checked[id] = !checked[id];
  var el = document.querySelector('[data-id="' + id + '"]');
  if (el) el.classList.toggle('checked', !!checked[id]);
  updateProgress();
  var secId = id.split('__')[0];
  updateSectionProgress(secId);
  saveState();
}

function updateProgress() {
  var total = allItems.length;
  var done = allItems.filter(function(i) { return checked[i.id]; }).length;
  var pct = total ? (done / total * 100) : 0;
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('progText').textContent = done + ' / ' + total;

  var critMissing = allItems.filter(function(i) { return i.critical && !checked[i.id]; });
  var alert = document.getElementById('alertMissing');
  if (critMissing.length > 0 && done > 0) {
    alert.style.display = 'block';
    alert.textContent = '⚠ ' + critMissing.length + ' item(s) CRITIQUE(S) non coches';
  } else {
    alert.style.display = 'none';
  }

  var secIds = [];
  allItems.forEach(function(i) {
    var sid = i.id.split('__')[0];
    if (secIds.indexOf(sid) < 0) secIds.push(sid);
  });
  secIds.forEach(function(sid) { updateSectionProgress(sid); });
}

function updateSectionProgress(sid) {
  var secItems = allItems.filter(function(i) { return i.id.split('__')[0] === sid; });
  var done = secItems.filter(function(i) { return checked[i.id]; }).length;
  var el = document.getElementById('sp_' + sid);
  if (el) {
    el.textContent = done + '/' + secItems.length;
    el.classList.toggle('done', done === secItems.length && secItems.length > 0);
  }
}

function showSummary() {
  var total = allItems.length;
  var done = allItems.filter(function(i) { return checked[i.id]; }).length;
  var pct = total ? Math.round(done / total * 100) : 0;
  var critMissing = allItems.filter(function(i) { return i.critical && !checked[i.id]; });

  var scoreEl = document.getElementById('sumScore');
  scoreEl.textContent = pct + '%';
  scoreEl.className = 'sum-score' + (pct >= 90 ? '' : pct >= 70 ? ' warn' : ' danger');
  document.getElementById('sumLabel').textContent = done + ' sur ' + total + ' items coches';

  var missingDiv = document.getElementById('sumMissing');
  if (critMissing.length > 0) {
    var html = '<div class="missing-list"><div class="missing-title">⚠ ' + critMissing.length + ' ITEMS CRITIQUES MANQUANTS</div>';
    critMissing.forEach(function(i) {
      html += '<div class="missing-item">' + i.name + '</div>';
    });
    html += '</div>';
    missingDiv.innerHTML = html;
  } else {
    missingDiv.innerHTML = '<div style="text-align:center;color:#39d98a;font-family:JetBrains Mono,monospace;font-size:0.85rem;margin-bottom:1.5rem">✓ Tous les items critiques sont coches</div>';
  }

  document.getElementById('summary').style.display = 'block';
}

function hideSummary() {
  document.getElementById('summary').style.display = 'none';
}

function confirmReset() {
  if (confirm('Recommencer depuis le debut ?')) {
    Object.keys(checked).forEach(function(k) { delete checked[k]; });
    Object.keys(picks).forEach(function(k) { delete picks[k]; });
    try { localStorage.removeItem('wsc_checked'); localStorage.removeItem('wsc_picks'); } catch(e) {}
    document.getElementById('app').style.display = 'none';
    document.getElementById('summary').style.display = 'none';
    document.getElementById('onboarding').style.display = 'flex';
    document.querySelectorAll('.ob-btn').forEach(function(b) { b.classList.remove('selected'); });
    document.getElementById('launchBtn').classList.remove('ready');
  }
}

// Auto-restore on page load
(function() {
  loadState();
  var allPicked = ['sport','equip','meteo','role','level','weight'].every(function(g){ return picks[g]; });
  if (allPicked) {
    // Restore button selections
    Object.keys(picks).forEach(function(g) {
      var btn = document.querySelector('[data-group="' + g + '"][data-val="' + picks[g] + '"]');
      if (btn) btn.classList.add('selected');
    });
    // Auto-launch
    launch();
  }
})();
</script>
